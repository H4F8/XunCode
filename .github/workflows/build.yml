name: Build XunCode

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.txt'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.txt'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  # ── Android build ─────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install npm deps and bundle Monaco Editor
        run: npm install && npm run build:monaco

      - name: Verify proot binary exists
        run: |
          if [ ! -f "android/app/src/main/jniLibs/arm64-v8a/libproot.so" ]; then
            echo "Error: libproot.so not found in jniLibs"
            echo "Please ensure the binary is committed to the repository"
            exit 1
          fi
          file android/app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Verify AXS binary exists
        run: |
          if [ ! -f "assets/axs/axs" ]; then
            echo "AXS binary not found in assets, downloading..."
            mkdir -p assets/axs
            curl -L -o assets/axs/axs https://github.com/bajrangCoder/acodex_server/releases/latest/download/axs-musl-android-arm64
            chmod +x assets/axs/axs
          fi
          if [ ! -f "android/app/src/main/jniLibs/arm64-v8a/libaxs.so" ]; then
            mkdir -p android/app/src/main/jniLibs/arm64-v8a
            cp assets/axs/axs android/app/src/main/jniLibs/arm64-v8a/libaxs.so
          fi
          file assets/axs/axs
          echo "AXS binary ready"

      - name: Bundle Alpine rootfs into APK assets
        run: |
          if [ ! -f "assets/rootfs/rootfs.tar.gz" ]; then
            echo "Rootfs not embedded; downloading for arm64..."
            ./scripts/bundle-rootfs.sh aarch64
          fi
          ls -lh assets/rootfs/rootfs.tar.gz

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-debug-renamed.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug-renamed.apk
          retention-days: 14

      - name: Restore signing keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Keystore restored ($RUNNER_TEMP/upload-keystore.jks)"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set — release APK will be signed with the DEBUG key and must not be published"
          fi

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify release signature
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | tail -1)/apksigner" verify --print-certs "$APK" || {
            echo "::error::Release APK is not properly signed"; exit 1;
          }

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: artifacts/android

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/app-release.apk
          generate_release_notes: true
