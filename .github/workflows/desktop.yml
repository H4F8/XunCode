name: Build XunCode Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Install npm dependencies
        run: npm install

      - name: Generate Tauri icons
        run: cargo tauri icon src-tauri/icons/icon.png

      - name: Build Tauri app
        run: cargo tauri build --target x86_64-unknown-linux-gnu

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: xuncode-desktop-linux-${{ github.sha }}
          path: desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.tar.gz
          retention-days: 14

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: xuncode-desktop-appimage-${{ github.sha }}
          path: desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
          retention-days: 14
