[package]
name = "xuncode-desktop"
version = "1.0.0"
description = "XunCode desktop editor with Monaco and terminal"
authors = ["XunCode Team"]
license = "GPL-3.0"
repository = "https://github.com/H4F8/XunCode"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-store = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
