<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="xterm.min.css">
<script src="xterm.min.js"></script>
<script src="addon-fit.min.js"></script>
<script src="addon-attach.min.js"></script>
<script src="addon-webgl.min.js"></script>
<script src="addon-search.min.js"></script>
<script src="addon-unicode11.min.js"></script>
<script src="addon-web-links.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #1e1e1e;
    overflow: hidden;
  }
  #term-container {
    width: 100%; height: 100%;
    padding: 4px;
    box-sizing: border-box;
    position: relative;
  }
  #term-container > div {
    width: 100%; height: 100%;
  }
  .xterm .xterm-viewport::-webkit-scrollbar { width: 6px; }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb {
    background: #424242; border-radius: 3px;
  }
  .xterm .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="term-container"></div>
<script>
(function () {
  'use strict';

  var currentId = null;
  // id -> { term, fit, container, ws?, attached?, resizeHandler? }
  var terms = {};

  function theme() {
    return {
      background: '#1e1e1e',
      foreground: '#cccccc',
      cursor: '#aeafad',
      cursorAccent: '#1e1e1e',
      selectionBackground: '#264f78',
      black: '#000000',
      red: '#cd3131',
      green: '#0dbc79',
      yellow: '#e5e510',
      blue: '#2472c8',
      magenta: '#bc3fbc',
      cyan: '#11a8cd',
      white: '#e5e5e5',
      brightBlack: '#666666',
      brightRed: '#f14c4c',
      brightGreen: '#23d18b',
      brightYellow: '#f5f543',
      brightBlue: '#3b8eea',
      brightMagenta: '#d670d6',
      brightCyan: '#29b8db',
      brightWhite: '#ffffff'
    };
  }

  function fitSafe(t) { try { t.fit.fit(); } catch (e) {} }

  function loadAddons(t) {
    var fit = new FitAddon.FitAddon();
    t.term.loadAddon(fit);
    t.fit = fit;
    try { var u11 = new Unicode11Addon.Unicode11Addon(); t.term.loadAddon(u11); t.term.unicode.activeVersion = '11'; } catch (e) {}
    try { t.term.loadAddon(new WebLinksAddon.WebLinksAddon()); } catch (e) {}
    try { t.search = new SearchAddon.SearchAddon(); t.term.loadAddon(t.search); } catch (e) {}
    // WebGL-рендерер как в AcodeX; при неудаче остаётся DOM-рендер.
    setTimeout(function () {
      try {
        var gl = new WebglAddon.WebglAddon();
        gl.onContextLoss(function () { gl.dispose(); });
        t.term.loadAddon(gl);
      } catch (e) {}
    }, 50);
  }

  function create(id, cols, rows) {
    if (terms[id]) return;
    var container = document.createElement('div');
    container.style.display = 'none';
    document.getElementById('term-container').appendChild(container);

    var term = new window.Terminal({
      fontSize: 12,
      lineHeight: 1.1,
      fontFamily: "'Droid Sans Mono', 'Cutive Mono', monospace",
      cursorBlink: true,
      scrollback: 5000,
      theme: theme(),
      allowProposedApi: true,
      convertEol: false
    });
    if (cols && rows) term.resize(cols, rows);

    var t = { term: term, fit: null, container: container, ws: null, attached: false };
    loadAddons(t);
    term.open(container);
    setTimeout(function () { fitSafe(t); }, 30);

    // Ввод уходит в Dart только в legacy-режиме (desktop);
    // в attached-режиме ввод идёт прямо в WebSocket через AttachAddon.
    term.onData(function (d) {
      if (!t.attached) {
        window.flutter_inappwebview.callHandler('termData', d);
      }
    });
    term.onResize(function (sz) {
      if (!t.attached) {
        window.flutter_inappwebview.callHandler('termResize', sz.cols, sz.rows);
      } else if (t.wsPort && t.wsPid) {
        resizeRemote(t, sz.cols, sz.rows);
      }
    });

    if (window.ResizeObserver) {
      new ResizeObserver(function () { fitSafe(t); }).observe(container);
    }

    terms[id] = t;
    if (!currentId) show(id);
  }

  function resizeRemote(t, cols, rows) {
    try {
      fetch('http://127.0.0.1:' + t.wsPort + '/terminals/' + t.wsPid + '/resize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cols: String(cols), rows: String(rows) })
      }).catch(function () {});
    } catch (e) {}
  }

  // Прямое подключение эмулятора к AXS — как в AcodeX:
  // ввод/вывод идут через AttachAddon, минуя Dart-мост.
  function attach(id, port, pid, cols, rows) {
    var t = terms[id];
    if (!t || t.attached) return;
    try {
      var ws = new WebSocket('ws://127.0.0.1:' + port + '/terminals/' + pid);
      t.ws = ws;
      t.wsPort = port;
      t.wsPid = pid;
      ws.onopen = function () {
        t.attached = true;
        try { t.term.loadAddon(new AttachAddon.AttachAddon(ws)); } catch (e) {}
        if (cols && rows) resizeRemote(t, cols, rows);
      };
      ws.onclose = function () {
        t.attached = false;
        try { t.term.write('\r\n\x1b[90m[session ended]\x1b[0m\r\n'); } catch (e) {}
      };
    } catch (e) {}
  }

  function show(id) {
    Object.keys(terms).forEach(function (k) {
      terms[k].container.style.display = (k === id) ? 'block' : 'none';
    });
    currentId = id;
    var t = terms[id];
    if (t) {
      t.term.focus();
      setTimeout(function () { fitSafe(t); }, 60);
    }
  }

  // Legacy-режим (desktop / fallback): байты приходят из Dart.
  function write(data) {
    var t = terms[currentId];
    if (t) t.term.write(data);
  }

  function closeTerm(id) {
    var t = terms[id];
    if (!t) return;
    try { if (t.ws) t.ws.close(); } catch (e) {}
    try { t.term.dispose(); } catch (e) {}
    t.container.remove();
    delete terms[id];
    if (currentId === id) {
      var rest = Object.keys(terms);
      if (rest.length > 0) show(rest[rest.length - 1]);
      else currentId = null;
    }
  }

  window.termApi = {
    create: create,
    attach: attach,
    show: show,
    write: write,
    closeTerm: closeTerm,
    setFontSize: function (px) {
      Object.keys(terms).forEach(function (k) {
        terms[k].term.options.fontSize = px;
      });
      if (currentId && terms[currentId]) fitSafe(terms[currentId]);
    },
    refitAll: function () {
      Object.keys(terms).forEach(function (k) { fitSafe(terms[k]); });
    },
    searchNext: function (q) {
      var t = terms[currentId];
      if (t && t.search) try { t.search.findNext(q); } catch (e) {}
    }
  };

  window.flutter_inappwebview.callHandler('termReady');
})();
</script>
</body>
</html>
