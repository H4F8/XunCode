plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) flutterVersionCode = '1'

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) flutterVersionName = '1.0'

// Подпись релиза: сначала переменные окружения (CI), затем key.properties
// (локальная сборка). Если ключа нет — фолбэк на debug, чтобы сборка не падала.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def ksStorePath = System.getenv('KEYSTORE_PATH') ?: keystoreProperties.getProperty('storeFile')
def ksStorePassword = System.getenv('KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def ksKeyAlias = System.getenv('KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def ksKeyPassword = System.getenv('KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')
def ksStoreFile = (ksStorePath != null) ? file(ksStorePath) : null
def hasReleaseKey = ksStoreFile != null &&
        ksStoreFile.exists() &&
        ksStorePassword != null &&
        ksKeyAlias != null &&
        ksKeyPassword != null

android {
    buildFeatures {
        buildConfig true
    }
    namespace "com.xunkal1.xuncode"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.xunkal1.xuncode"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        resValue "string", "app_name", "XunCode"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile ksStoreFile
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
