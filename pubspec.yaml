name: xuncode
description: XunCode — open-source code editor for Android. Monaco Editor, plugins, terminal, and marketplace.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  dio: ^5.7.0
  http: ^1.2.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.2
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#1E1E1E"
  adaptive_icon_foreground: "icon.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/axs/axs
    - assets/rootfs/rootfs.tar.gz
    - assets/rootfs/manifest.json
    - assets/editor.html
    - assets/plugin-docs.html
    - assets/languages/
    - assets/plugin-examples/hello-world/
    - assets/monaco/vs/
    - assets/monaco/vs/base/worker/
    - assets/monaco/vs/basic-languages/
    - assets/monaco/vs/editor/
    - assets/monaco/vs/language/
